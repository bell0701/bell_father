<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안심 모니터링 대시보드</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --safe-color: #4ade80;
            --warning-color: #f87171;
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #1e1b4b, #312e81, #4c1d95, #701a75);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-primary);
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .dashboard-container {
            width: 100%;
            max-width: 480px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: var(--card-shadow);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #cbd5e1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .status-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .status-card:hover {
            transform: translateY(-4px);
            background: rgba(0, 0, 0, 0.3);
        }

        .icon-box {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            margin-right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.1);
        }

        .info-box h3 {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-box p {
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px currentColor;
        }

        .status-safe { color: var(--safe-color); background-color: var(--safe-color); }
        .status-warning { color: var(--warning-color); background-color: var(--warning-color); }
        
        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 400px) {
            .dashboard-container { padding: 30px 20px; }
            .status-card { padding: 16px; }
            .icon-box { width: 50px; height: 50px; font-size: 24px; margin-right: 16px; }
            .info-box p { font-size: 18px; }
        }

        /* User Input Styles */
        .user-input-container {
            margin-bottom: 24px;
            display: flex;
            gap: 10px;
        }
        
        .user-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat, repeat;
            background-position: right .7em top 50%, 0 0;
            background-size: .65em auto, 100%;
        }
        
        .user-input:focus {
            border-color: var(--safe-color);
            background-color: rgba(0, 0, 0, 0.3);
        }
        
        .user-input option {
            background: #2a2a2a;
            color: white;
        }
        
        .btn-search {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            background: var(--safe-color);
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-search:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* SMS Alert Section Styles */
        .sms-card-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .sms-card-container:hover {
            background: rgba(0, 0, 0, 0.25);
        }

        .sms-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .sms-title-box {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .sms-badge-count {
            background: rgba(250, 204, 21, 0.2);
            color: #facc15;
            border: 1px solid rgba(250, 204, 21, 0.4);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
        }

        .sms-action-toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            align-items: center;
        }

        .sms-date-select {
            flex: 1;
            padding: 9px 14px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sms-date-select:focus {
            border-color: var(--safe-color);
        }

        .sms-date-select option {
            background: #2a2a2a;
            color: white;
        }

        .btn-delete-sms {
            padding: 9px 14px;
            border-radius: 10px;
            border: 1px solid rgba(248, 113, 113, 0.4);
            background: rgba(248, 113, 113, 0.15);
            color: #fca5a5;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-delete-sms:hover {
            background: rgba(248, 113, 113, 0.3);
            color: #ffffff;
            border-color: #f87171;
            transform: translateY(-1px);
        }

        .sms-list-scroll {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sms-list-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .sms-list-scroll::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }
        .sms-list-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .sms-date-group {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 12px;
            padding: 12px;
        }

        .sms-date-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 10px;
        }

        .btn-date-del {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #fca5a5;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            padding: 3px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .btn-date-del:hover {
            background: rgba(248, 113, 113, 0.25);
            color: #fff;
        }

        .sms-item-card {
            background: rgba(0, 0, 0, 0.28);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 3px solid #facc15;
            transition: background 0.2s;
        }

        .sms-item-card:hover {
            background: rgba(0, 0, 0, 0.4);
        }

        .sms-item-card:last-child {
            margin-bottom: 0;
        }

        .sms-item-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .sms-keyword-tag {
            color: #facc15;
            font-weight: bold;
            margin-right: 6px;
        }

        .sms-sender-text {
            color: white;
            font-weight: 600;
        }

        .sms-time-text {
            color: #9ca3af;
            font-size: 12px;
        }

        .btn-item-del {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #9ca3af;
            font-size: 11px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-item-del:hover {
            background: rgba(248, 113, 113, 0.3);
            color: #f87171;
        }

        .sms-content-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h1>부모님 안심 모니터링</h1>
            <p>실시간 상태 대시보드</p>
        </div>

        <!-- 1. 사용자 선택 -->
        <div class="user-input-container">
            <select id="targetUser" class="user-input" onchange="manualFetch()">
                <option value="">확인할 기기 선택...</option>
            </select>
            <button class="btn-search" onclick="manualFetch()">새로고침</button>
        </div>

        <!-- 2. 위치 상태 -->
        <div class="status-card" id="locationCard">
            <div class="icon-box">📍</div>
            <div class="info-box">
                <h3>현재 위치 상태</h3>
                <p id="locationText">데이터 불러오는 중...</p>
            </div>
        </div>

        <!-- 3. 화면 상태 -->
        <div class="status-card" id="screenCard">
            <div class="icon-box">📱</div>
            <div class="info-box">
                <h3>현재 폰 화면 상태</h3>
                <p id="screenText">데이터 불러오는 중...</p>
            </div>
        </div>

        <!-- 4. 모니터링 동작 상태 -->
        <div class="status-card">
            <div class="icon-box">🛡️</div>
            <div class="info-box">
                <h3>앱 모니터링 상태</h3>
                <p id="monitoringText">데이터 불러오는 중...</p>
            </div>
        </div>

        <!-- 5. 중요 문자 감지 내역 (일자별 정리 및 삭제 지원) -->
        <div class="sms-card-container" id="smsCard">
            <div class="sms-header-row">
                <div class="sms-title-box">
                    <div class="icon-box" style="width: 48px; height: 48px; font-size: 24px; margin-right: 0;">📩</div>
                    <div>
                        <h3 style="font-size: 14px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px;">중요 문자 감지 내역</h3>
                        <div style="display: flex; align-items: center; gap: 8px; margin-top: 2px;">
                            <span id="smsTotalCount" class="sms-badge-count">총 0건</span>
                            <span id="smsLastTime" style="font-size: 12px; color: #9ca3af;"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 일자 선택 및 삭제 툴바 -->
            <div class="sms-action-toolbar">
                <select id="smsDateFilter" class="sms-date-select" onchange="onSmsDateFilterChange()">
                    <option value="ALL">전체 일자 보기</option>
                </select>
                <button class="btn-delete-sms" onclick="deleteSelectedDate()" title="선택한 일자의 문자를 모두 삭제합니다">선택 일자 삭제 🗑️</button>
            </div>

            <!-- 일자별 문자 목록 영역 -->
            <div class="sms-list-scroll" id="smsListContainer">
                <p style="color: #9ca3af; text-align: center; padding: 20px 0; font-size: 14px;">데이터 불러오는 중...</p>
            </div>
        </div>

        <div class="footer">
            <div class="loading-spinner" id="spinner"></div>
            <span id="updateTime">데이터 연결 중...</span>
        </div>
    </div>

    <script>
        const FIREBASE_AUTH = "eyJhbGciOiJSUzI1NiIsImtpZCI6IjI0N2Y4MDYwMDM5YjVmNDBkOTQ5NjkzOGJiMTg5NzA2ZWY4ODkzM2QiLCJ0eXAiOiJKV1QifQ.eyJwcm92aWRlcl9pZCI6ImFub255bW91cyIsImlzcyI6Imh0dHBzOi8vc2VjdXJldG9rZW4uZ29vZ2xlLmNvbS9mYXRoZXItMWI3ODciLCJhdWQiOiJmYXRoZXItMWI3ODciLCJhdXRoX3RpbWUiOjE3ODg0OTM3MDgsInVzZXJfaWQiOiJobndNVm9DT3hQZUpYS1FlcVhBMk1pRVljcU0yIiwic3ViIjoiaG53TVZvQ094UGVKWEtRZXFYQTJNaUVZY3FNMiIsImlhdCI6MTc4ODQ5MzcwOCwiZXhwIjoxNzg4NDk3MzA4LCJmaXJlYmFzZSI6eyJpZGVudGl0aWVzIjp7fSwic2lnbl9pbl9wcm92aWRlciI6ImFub255bW91cyJ9fQ.nOa0QznCV7cFB8xzDogAU1ACrTKSqlZotNGYFCHZqVwnQ-4nBDujKpzxi_yszg7Iip5gZKFJKMTJI-czSlJbJeINpBpFrYYf1P8JVvEAH3NPiwhsHWhzkl1nlkAK1VVzhtx0x3fK5IWgnTo7EJ84Lf0K_xReNWRn0lZxkawyZl3weMRdaH_x8F-TIutUm7UHTnohLw2yzgOINLKmvM8HSnzhJBmtziovb4FWTaK3DM2ytGr193ZirFGuVU2tbbSFUSobja4z49Rsirx7UZTN9oYD2RZclMpRJQ_ucz7FEJ1u3e0G1CuU7-jtMPpOfh9UpbFFWsr50VZw4yZNFOfyaA";
        let currentSmsList = [];

        function formatRelativeTime(timestamp) {
            const now = Date.now();
            const diffMin = Math.floor((now - timestamp) / (1000 * 60));
            const diffHour = Math.floor(diffMin / 60);

            if (diffMin < 1) return "방금 전";
            if (diffMin < 60) return `${diffMin}분 전`;
            if (diffHour < 24) return `${diffHour}시간 전`;
            return `${Math.floor(diffHour/24)}일 전`;
        }

        function formatExactTime(timestamp) {
            const date = new Date(timestamp);
            const isToday = new Date().toDateString() === date.toDateString();
            const timeStr = date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
            return isToday ? `오늘 ${timeStr}` : `${date.getMonth()+1}월 ${date.getDate()}일 ${timeStr}`;
        }

        async function fetchStatus() {
            const userSelect = document.getElementById('targetUser');
            const userNameInput = userSelect.value.trim();
            if (!userNameInput) {
                document.getElementById('updateTime').textContent = "기기를 선택해주세요.";
                document.getElementById('locationText').innerHTML = `대기 중`;
                document.getElementById('screenText').innerHTML = `대기 중`;
                document.getElementById('monitoringText').innerHTML = `대기 중`;
                document.getElementById('smsTotalCount').textContent = `총 0건`;
                document.getElementById('smsLastTime').textContent = "";
                document.getElementById('smsListContainer').innerHTML = `<p style="color: #9ca3af; text-align: center; padding: 20px 0; font-size: 14px;">기기를 선택해주세요.</p>`;
                // 스피너 멈춤
                document.getElementById('spinner').style.animation = 'none';
                return;
            }
            
            // 사용자 전체 데이터(상태 및 SMS 알림 로그) 조회 URL
            const userUrl = `https://father-1b787-default-rtdb.firebaseio.com/users/${encodeURIComponent(userNameInput)}.json?auth=${FIREBASE_AUTH}`;

            try {
                const response = await fetch(userUrl);
                if (!response.ok) throw new Error("네트워크 응답 오류");
                
                const userData = await response.json();
                
                if (userData) {
                    const data = userData.status || {};
                    const smsAlertsData = userData.smsAlerts || null;

                    // 1. 위치 업데이트
                    if (data.isHome !== undefined) {
                        if (data.isHome) {
                            document.getElementById('locationText').innerHTML = `집 (Wi-Fi 연결됨) 🏡`;
                        } else {
                            document.getElementById('locationText').innerHTML = `외출 중 🚶‍♂️`;
                        }
                    }

                    // 2. 화면 켬/끔 및 지속 시간 업데이트
                    if (data.isScreenOn !== undefined) {
                        let durationStr = "";
                        const suffix = data.isScreenOn ? "사용 중" : "대기 중";
                        
                        if (data.screenStateChangedAt) {
                            const diffMs = Date.now() - data.screenStateChangedAt;
                            const diffMins = Math.floor(diffMs / (1000 * 60));
                            if (diffMins < 60) {
                                durationStr = `(${diffMins}분 ${suffix})`;
                            } else {
                                const diffHours = Math.floor(diffMins / 60);
                                const remMins = diffMins % 60;
                                if (remMins === 0) {
                                    durationStr = `(${diffHours}시간 ${suffix})`;
                                } else {
                                    durationStr = `(${diffHours}시간 ${remMins}분 ${suffix})`;
                                }
                            }
                        } else {
                            durationStr = `(0분 ${suffix})`;
                        }

                        if (data.isScreenOn) {
                            document.getElementById('screenText').innerHTML = `<span style="color: #4ade80;">화면 켜짐${durationStr}</span>`;
                        } else {
                            document.getElementById('screenText').innerHTML = `<span style="color: #9ca3af;">화면꺼짐${durationStr}</span>`;
                        }
                    }

                    // 3. 앱 모니터링 상태 업데이트
                    if (data.isMonitoring !== undefined) {
                        const locCard = document.getElementById('locationCard');
                        const scrCard = document.getElementById('screenCard');
                        if (data.isMonitoring) {
                            document.getElementById('monitoringText').innerHTML = `<span style="color: #4ade80;">모니터링 작동 중 🟢</span>`;
                            if(locCard) { locCard.style.opacity = '1'; locCard.style.filter = 'none'; }
                            if(scrCard) { scrCard.style.opacity = '1'; scrCard.style.filter = 'none'; }
                        } else {
                            document.getElementById('monitoringText').innerHTML = `<span style="color: var(--warning-color);">중지됨 🔴</span>`;
                            if(locCard) { locCard.style.opacity = '0.4'; locCard.style.filter = 'grayscale(100%)'; }
                            if(scrCard) { scrCard.style.opacity = '0.4'; scrCard.style.filter = 'grayscale(100%)'; }
                        }
                    }

                    // 4. 중요 문자 감지 내역 (일자별 정리)
                    processAndRenderSms(smsAlertsData, data.lastSmsAlert);

                } else {
                    document.getElementById('locationText').innerHTML = `데이터 없음`;
                    document.getElementById('screenText').innerHTML = `데이터 없음`;
                    document.getElementById('monitoringText').innerHTML = `데이터 없음`;
                    document.getElementById('smsTotalCount').textContent = `총 0건`;
                    document.getElementById('smsLastTime').textContent = "";
                    document.getElementById('smsListContainer').innerHTML = `<p style="color: #9ca3af; text-align: center; padding: 20px 0; font-size: 14px;">데이터 없음</p>`;
                }

                // 업데이트 시간 갱신
                const nowStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                document.getElementById('updateTime').textContent = `마지막 업데이트: ${nowStr}`;
                
                // 에러 후 복구시 스피너 애니메이션 재개
                document.getElementById('spinner').style.animation = 'spin 1s ease-in-out infinite';
                document.getElementById('spinner').style.borderColor = 'rgba(255,255,255,0.3)';
                document.getElementById('spinner').style.borderTopColor = '#fff';

            } catch (error) {
                console.error("데이터 로드 실패:", error);
                document.getElementById('updateTime').textContent = "연결 실패. 재시도 중...";
                // 에러시 스피너 멈춤 및 빨간색 표시
                document.getElementById('spinner').style.animation = 'none';
                document.getElementById('spinner').style.borderColor = 'var(--warning-color)';
            }
        }

        // --- 중요 문자 일자별 정리 및 삭제 로직 ---

        function processAndRenderSms(smsAlertsData, lastSmsAlert) {
            const list = [];
            if (smsAlertsData && typeof smsAlertsData === 'object') {
                Object.entries(smsAlertsData).forEach(([key, val]) => {
                    if (val && typeof val === 'object') {
                        let dateStr = "";
                        if (val.timeString && val.timeString.includes(' ')) {
                            dateStr = val.timeString.split(' ')[0];
                        } else if (val.timestamp) {
                            const d = new Date(val.timestamp);
                            dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                        } else {
                            dateStr = "기타";
                        }
                        list.push({
                            key: key,
                            raw: val,
                            sender: val.sender || "알 수 없음",
                            body: val.body || "",
                            keyword: val.keyword || "",
                            timestamp: val.timestamp || 0,
                            timeString: val.timeString || "",
                            dateStr: dateStr
                        });
                    }
                });
            }

            // 만약 smsAlerts 목록이 비어있고 status에 lastSmsAlert만 남아있는 경우 대비
            if (list.length === 0 && lastSmsAlert && typeof lastSmsAlert === 'object') {
                let dateStr = "";
                if (lastSmsAlert.timeString && lastSmsAlert.timeString.includes(' ')) {
                    dateStr = lastSmsAlert.timeString.split(' ')[0];
                } else if (lastSmsAlert.timestamp) {
                    const d = new Date(lastSmsAlert.timestamp);
                    dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                } else {
                    dateStr = "기타";
                }
                list.push({
                    key: "__lastSmsAlert__",
                    raw: lastSmsAlert,
                    sender: lastSmsAlert.sender || "알 수 없음",
                    body: lastSmsAlert.body || "",
                    keyword: lastSmsAlert.keyword || "",
                    timestamp: lastSmsAlert.timestamp || 0,
                    timeString: lastSmsAlert.timeString || "",
                    dateStr: dateStr
                });
            }

            // 최신 시간순 정렬
            list.sort((a, b) => b.timestamp - a.timestamp);
            currentSmsList = list;

            updateSmsDateFilterOptions();
            renderSmsList();
        }

        function updateSmsDateFilterOptions() {
            const dateSelect = document.getElementById('smsDateFilter');
            const currentVal = dateSelect.value;

            // 일자별 카운트 계산
            const dateCounts = {};
            currentSmsList.forEach(item => {
                dateCounts[item.dateStr] = (dateCounts[item.dateStr] || 0) + 1;
            });
            const sortedDates = Object.keys(dateCounts).sort().reverse();

            dateSelect.innerHTML = `<option value="ALL">전체 일자 보기 (${currentSmsList.length}건)</option>`;
            sortedDates.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = `${getDateDisplayLabel(d)} (${dateCounts[d]}건)`;
                if (d === currentVal) opt.selected = true;
                dateSelect.appendChild(opt);
            });

            if (currentVal && (currentVal === 'ALL' || dateCounts[currentVal])) {
                dateSelect.value = currentVal;
            } else {
                dateSelect.value = 'ALL';
            }
        }

        function onSmsDateFilterChange() {
            renderSmsList();
        }

        function getDateDisplayLabel(dateStr) {
            if (!dateStr || dateStr === "기타") return "기타";
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;

            if (dateStr === todayStr) return `${dateStr} (오늘)`;
            if (dateStr === yesterdayStr) return `${dateStr} (어제)`;
            return dateStr;
        }

        function renderSmsList() {
            const container = document.getElementById('smsListContainer');
            const totalCountBadge = document.getElementById('smsTotalCount');
            const lastTimeSpan = document.getElementById('smsLastTime');
            const dateSelect = document.getElementById('smsDateFilter');
            const filterDate = dateSelect.value || 'ALL';

            totalCountBadge.textContent = `총 ${currentSmsList.length}건`;

            if (currentSmsList.length > 0) {
                const latest = currentSmsList[0];
                lastTimeSpan.textContent = `최근: ${formatRelativeTime(latest.timestamp)}`;
            } else {
                lastTimeSpan.textContent = "";
            }

            if (currentSmsList.length === 0) {
                container.innerHTML = `<p style="color: #9ca3af; text-align: center; padding: 24px 0; font-size: 14px;">감지된 중요 문자가 없습니다.</p>`;
                return;
            }

            // 필터링 적용
            const displayItems = filterDate === 'ALL' 
                ? currentSmsList 
                : currentSmsList.filter(item => item.dateStr === filterDate);

            if (displayItems.length === 0) {
                container.innerHTML = `<p style="color: #9ca3af; text-align: center; padding: 20px 0; font-size: 14px;">선택한 일자에 해당하는 문자가 없습니다.</p>`;
                return;
            }

            // 일자별 그룹화
            const groups = {};
            displayItems.forEach(item => {
                if (!groups[item.dateStr]) groups[item.dateStr] = [];
                groups[item.dateStr].push(item);
            });

            const sortedDates = Object.keys(groups).sort().reverse();

            let html = "";
            sortedDates.forEach(d => {
                const items = groups[d];
                const dateLabel = getDateDisplayLabel(d);
                html += `
                <div class="sms-date-group">
                    <div class="sms-date-header">
                        <span>📅 ${dateLabel} <span class="sms-badge-count" style="font-size: 11px; padding: 1px 6px;">${items.length}건</span></span>
                        <button class="btn-date-del" onclick="deleteDateGroup('${d}')" title="${d} 일자의 문자 전체 삭제">🗑️ 이 날짜 삭제</button>
                    </div>
                    <div class="sms-items-list">
                `;

                items.forEach(item => {
                    const timeDisplay = (item.timeString && item.timeString.includes(' '))
                        ? item.timeString.split(' ')[1]
                        : (item.timestamp ? new Date(item.timestamp).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '');

                    const safeSender = escapeHtml(item.sender);
                    const safeKeyword = escapeHtml(item.keyword);
                    const safeBody = escapeHtml(item.body);

                    html += `
                        <div class="sms-item-card">
                            <div class="sms-item-meta">
                                <div>
                                    <span class="sms-keyword-tag">[${safeKeyword}]</span>
                                    <span class="sms-sender-text">${safeSender}</span>
                                </div>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span class="sms-time-text">${timeDisplay}</span>
                                    <button class="btn-item-del" onclick="deleteSingleMessage('${item.key}')" title="이 문자 삭제">✕</button>
                                </div>
                            </div>
                            <div class="sms-content-text">${safeBody}</div>
                        </div>
                    `;
                });

                html += `
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function deleteSingleMessage(key) {
            const userSelect = document.getElementById('targetUser');
            const userName = userSelect.value.trim();
            if (!userName || !key) return;

            if (!confirm('해당 문자를 삭제하시겠습니까?')) return;

            await performDeleteKeys(userName, [key]);
        }

        async function deleteDateGroup(dateStr) {
            const userSelect = document.getElementById('targetUser');
            const userName = userSelect.value.trim();
            if (!userName) return;

            const targets = currentSmsList.filter(item => item.dateStr === dateStr);
            if (targets.length === 0) return;

            const label = getDateDisplayLabel(dateStr);
            if (!confirm(`[${label}] 일자의 문자 ${targets.length}건을 모두 삭제하시겠습니까?`)) {
                return;
            }

            await performDeleteKeys(userName, targets.map(t => t.key));
        }

        async function deleteSelectedDate() {
            const userSelect = document.getElementById('targetUser');
            const userName = userSelect.value.trim();
            if (!userName) return;

            const dateSelect = document.getElementById('smsDateFilter');
            const selectedDate = dateSelect.value;

            if (!selectedDate || selectedDate === 'ALL') {
                if (currentSmsList.length === 0) {
                    alert('삭제할 문자 내역이 없습니다.');
                    return;
                }
                if (!confirm(`전체 중요 문자 내역 ${currentSmsList.length}건을 모두 삭제하시겠습니까?`)) {
                    return;
                }
                await performDeleteKeys(userName, currentSmsList.map(t => t.key));
            } else {
                await deleteDateGroup(selectedDate);
            }
        }

        async function performDeleteKeys(userName, keysToDelete) {
            try {
                const spinner = document.getElementById('spinner');
                spinner.style.animation = 'spin 1s ease-in-out infinite';

                // 1. Firebase PATCH로 null 설정하여 해당 키들 삭제
                const updatePayload = {};
                keysToDelete.forEach(k => {
                    if (k && k !== "__lastSmsAlert__") {
                        updatePayload[k] = null;
                    }
                });

                if (Object.keys(updatePayload).length > 0) {
                    const smsAlertsUrl = `https://father-1b787-default-rtdb.firebaseio.com/users/${encodeURIComponent(userName)}/smsAlerts.json?auth=${FIREBASE_AUTH}`;
                    await fetch(smsAlertsUrl, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatePayload)
                    });
                }

                // 2. status.lastSmsAlert 동기화 (남은 문자 중 최신것 설정, 없으면 null)
                const remaining = currentSmsList.filter(item => !keysToDelete.includes(item.key));
                remaining.sort((a, b) => b.timestamp - a.timestamp);
                const newLatest = remaining.length > 0 ? remaining[0].raw : null;

                const statusUrl = `https://father-1b787-default-rtdb.firebaseio.com/users/${encodeURIComponent(userName)}/status.json?auth=${FIREBASE_AUTH}`;
                await fetch(statusUrl, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lastSmsAlert: newLatest })
                });

                // 3. 최신 상태 새로고침
                await fetchStatus();
            } catch (e) {
                console.error('삭제 처리 중 오류:', e);
                alert('삭제 처리 중 오류가 발생했습니다: ' + e.message);
            }
        }

        function manualFetch() {
            fetchStatus();
        }

            try {
                const usersUrl = `https://father-1b787-default-rtdb.firebaseio.com/users.json?auth=eyJhbGciOiJSUzI1NiIsImtpZCI6IjI0N2Y4MDYwMDM5YjVmNDBkOTQ5NjkzOGJiMTg5NzA2ZWY4ODkzM2QiLCJ0eXAiOiJKV1QifQ.eyJwcm92aWRlcl9pZCI6ImFub255bW91cyIsImlzcyI6Imh0dHBzOi8vc2VjdXJldG9rZW4uZ29vZ2xlLmNvbS9mYXRoZXItMWI3ODciLCJhdWQiOiJmYXRoZXItMWI3ODciLCJhdXRoX3RpbWUiOjE3ODg0OTM3MDgsInVzZXJfaWQiOiJobndNVm9DT3hQZUpYS1FlcVhBMk1pRVljcU0yIiwic3ViIjoiaG53TVZvQ094UGVKWEtRZXFYQTJNaUVZY3FNMiIsImlhdCI6MTc4ODQ5MzcwOCwiZXhwIjoxNzg4NDk3MzA4LCJmaXJlYmFzZSI6eyJpZGVudGl0aWVzIjp7fSwic2lnbl9pbl9wcm92aWRlciI6ImFub255bW91cyJ9fQ.nOa0QznCV7cFB8xzDogAU1ACrTKSqlZotNGYFCHZqVwnQ-4nBDujKpzxi_yszg7Iip5gZKFJKMTJI-czSlJbJeINpBpFrYYf1P8JVvEAH3NPiwhsHWhzkl1nlkAK1VVzhtx0x3fK5IWgnTo7EJ84Lf0K_xReNWRn0lZxkawyZl3weMRdaH_x8F-TIutUm7UHTnohLw2yzgOINLKmvM8HSnzhJBmtziovb4FWTaK3DM2ytGr193ZirFGuVU2tbbSFUSobja4z49Rsirx7UZTN9oYD2RZclMpRJQ_ucz7FEJ1u3e0G1CuU7-jtMPpOfh9UpbFFWsr50VZw4yZNFOfyaA`;
                const response = await fetch(usersUrl);
                if (!response.ok) throw new Error("사용자 목록을 불러오지 못했습니다.");
                
                const data = await response.json();
                const userSelect = document.getElementById('targetUser');
                
                if (data) {
                    const users = Object.keys(data);
                    
                    // URL 파라미터에서 선택할 사용자 이름 확인
                    const urlParams = new URLSearchParams(window.location.search);
                    const userParam = urlParams.get('user');
                    let optionSelected = false;

                    users.forEach(user => {
                        // 이미 해당 옵션이 있는지 확인 (초기화시 중복 방지)
                        if (!Array.from(userSelect.options).some(opt => opt.value === user)) {
                            const option = document.createElement('option');
                            option.value = user;
                            option.textContent = user;
                            if (user === userParam) {
                                option.selected = true;
                                optionSelected = true;
                            }
                            userSelect.appendChild(option);
                        }
                    });

                    // 파라미터로 주어진 유저가 있거나, 첫 번째 유저 자동 선택
                    if (optionSelected || (users.length > 0 && userSelect.value === "")) {
                        if (!optionSelected && users.length > 0) {
                            userSelect.value = users[0];
                        }
                        fetchStatus(); // 유저 선택 후 상태 불러오기
                    }
                }
            } catch (error) {
                console.error("사용자 목록 로드 실패:", error);
            }
        }

        // 초기 로딩 (사용자 목록부터 불러옴)
        fetchUserList();

        // 10초마다 자동 갱신
        setInterval(fetchStatus, 10000);

        // 브라우저 탭이 다시 화면에 보일 때 즉시 갱신
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                fetchStatus();
                fetchUserList(); // 새 사용자가 생겼을 수도 있으니 목록도 갱신
            }
        });
    </script>
