<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보호자 안부 모니터링</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
font-family: -apple-system, sans-serif;
text-align: center;
background-color: #eef2f5;
margin: 0;
min-height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 20px;
}
.card {
background: white;
border-radius: 20px;
padding: 35px 25px;
box-shadow: 0 8px 24px rgba(0,0,0,0.07);
width: 100%;
max-width: 380px;
}
.status-box {
margin: 25px 0;
padding: 25px 15px;
border-radius: 16px;
font-size: 24px;
font-weight: bold;
transition: all 0.3s;
}
.active { background-color: #E8F5E9; color: #2E7D32; border: 2px solid #A5D6A7; }
.offline { background-color: #FFEBEE; color: #C62828; border: 2px solid #EF9A9A; }
.time-text { font-size: 14px; color: #777; margin-top: 8px; font-weight: normal; }
button {
background: #3498db;
color: white;
border: none;
padding: 12px 20px;
border-radius: 10px;
font-size: 15px;
cursor: pointer;
}
</style>
</head>
<body>

<div class="card">
<h2>👴 할아버지 안부 상태</h2>

<div id="statusBox" class="status-box offline">
<div id="statusText">신호 대기 중... ⏳</div>
<div id="timeText" class="time-text">-</div>
</div>

<button onclick="requestNotification()">🔔 소리/팝업 알림 켜기</button>
</div>

<script>
// ⭐ 할아버지 앱의 FAMILY_ID와 반드시 일치해야 합니다.
const FAMILY_ID = "my_family_care_1234";
const TOPIC = `care_status/${FAMILY_ID}`;

const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
const statusBox = document.getElementById('statusBox');
const statusText = document.getElementById('statusText');
const timeText = document.getElementById('timeText');

let timeoutTimer = null;

client.on('connect', () => {
client.subscribe(TOPIC);
});

client.on('message', (topic, message) => {
const data = JSON.parse(message.toString());
clearTimeout(timeoutTimer);

if (data.status === 'active') {
statusBox.className = 'status-box active';
statusText.textContent = '🟢 활동 중 (핸드폰 켜짐)';
timeText.textContent = `최근 감지: ${data.timestamp}`; 
} else { 
setOffline('🔴 꺼짐 (화면 닫힘)'); 
timeText.textContent = `꺼진 시간: ${data.timestamp}`;
}

// 25초 동안 신호가 없으면 자동으로 꺼짐 처리
timeoutTimer = setTimeout(() => {
setOffline('🔴 신호 끊김 (꺼짐 추정)');
}, 25000);
});

function setOffline(msg) {
statusBox.className = 'status-box offline';
statusText.textContent = msg;
}

function requestNotification() {
if (Notification.permission !== "granted") {
Notification.requestPermission();
} else {
alert("알림이 이미 활성화되어 있습니다.");
}
}
</script>
</body>
</html>
