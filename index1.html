<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보호자용 안부 확인</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; background: #eef2f5; padding: 20px; }
    .dashboard { background: white; padding: 30px; border-radius: 20px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .status { font-size: 24px; font-weight: bold; margin: 20px 0; padding: 15px; border-radius: 12px; }
    .active { background: #E8F5E9; color: #2E7D32; }
    .inactive { background: #FFEBEE; color: #C62828; }
    .time { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="dashboard">
    <h2>할아버지 스마트폰 상태</h2>
    <div id="statusBox" class="status inactive">수신 대기 중...</div>
    <div class="time" id="timeBox">마지막 신호: 없음</div>
  </div>

  <script>
    // 할아버지 앱과 반드시 동일한 ID를 입력하세요
    const FAMILY_ID = "my_family_care_1234"; 
    const TOPIC = `care_status/${FAMILY_ID}`;
    
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    const statusBox = document.getElementById('statusBox');
    const timeBox = document.getElementById('timeBox');

    client.on('connect', () => {
      client.subscribe(TOPIC);
    });

    client.on('message', (topic, message) => {
      const data = JSON.parse(message.toString());
      
      timeBox.textContent = `마지막 신호: ${data.timestamp}`;
      
      if (data.status === 'active') {
        statusBox.textContent = "📱 현재 화면 보는 중";
        statusBox.className = "status active";
      } else if (data.status === 'screen_off') {
        statusBox.textContent = "💤 화면 꺼짐";
        statusBox.className = "status inactive";
      }
    });
  </script>
</body>
</html>
